<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KVÉ</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="KVÉ">
<style>
:root{--cream:#FFFDF5;--blue:#95B1EE;--lime:#E7F1A8;--navy:#364C84;--line:#e7e9e6;--muted:#7d8799}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;padding:18px 16px 92px}
header{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px}
.brand{font-size:27px;letter-spacing:.24em;font-weight:400}
.circle{width:38px;height:38px;border:0;border-radius:50%;background:#f2f4f2;color:var(--navy);font-size:22px}
.search,.input,textarea,select{width:100%;background:#f3f4f2;border:1px solid transparent;border-radius:16px;padding:13px 14px;color:var(--navy);font:inherit}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}
.chip{white-space:nowrap;border:1px solid #e3e6e9;background:white;border-radius:999px;padding:8px 12px;font-size:12px;color:var(--navy)}
.chip.active{background:var(--lime);border-color:var(--lime)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.look{aspect-ratio:.74;border-radius:13px;overflow:hidden;background:#e8e6df;position:relative;cursor:pointer}
.look img{width:100%;height:100%;object-fit:cover}
.look .badge{position:absolute;left:6px;bottom:6px;background:#fffdf5dd;backdrop-filter:blur(8px);padding:4px 7px;border-radius:99px;font-size:9px}
.placeholder{height:100%;background:linear-gradient(145deg,#e8e3d9,#c8d7ee 52%,#dce89f)}
.fab{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:7px solid var(--cream);background:var(--lime);color:var(--navy);font-size:32px;box-shadow:0 5px 20px #364c8420;z-index:20}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:74px;background:#fffdf5f2;backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;padding:0 8px 8px;border-top:1px solid #eee;z-index:10}
.nav button{border:0;background:none;color:var(--navy);font-size:11px;display:flex;flex-direction:column;gap:5px;align-items:center}
.nav .ico{font-size:19px}
.page{display:none}.page.active{display:block}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cover{height:135px;background:linear-gradient(145deg,#d7e4fa,#f7f4e8)}
.folder h3{font-size:15px;margin:10px 12px 2px}.folder p{font-size:12px;margin:0 12px 12px;color:var(--muted)}
.idea{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;cursor:pointer}
.idea b{font-size:14px;display:block}.idea p{font-size:13px;line-height:1.4;color:#606b82}
.tag{display:inline-block;background:#edf3fd;padding:6px 9px;border-radius:999px;font-size:11px;margin:3px}
.sheet,.modal{position:fixed;inset:0;background:#364c8433;backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:16px 16px 94px;z-index:100}
.show{display:flex}
.menu,.panel{width:min(398px,100%);background:var(--cream);border-radius:28px;padding:14px;max-height:82vh;overflow:auto}
.action{padding:17px;border-radius:18px;background:white;margin:8px 0;border:1px solid var(--line);font-size:15px}
.action:nth-child(2){background:#f4f7e0}
.title{font-size:28px;font-weight:500;margin:14px 0}
.field{margin:12px 0}.field label{display:block;font-size:12px;margin:0 0 6px;color:var(--muted)}
textarea{min-height:82px;resize:vertical;background:white;border-color:var(--line)}
.input{margin:0;background:white;border-color:var(--line)}
.primary{width:100%;border:0;border-radius:16px;padding:14px;background:var(--navy);color:white;font:inherit;margin-top:10px}
.secondary{background:var(--lime);color:var(--navy)}
.upload{display:block;border:1.5px dashed #b8c3d8;border-radius:18px;padding:22px;text-align:center;background:white}
.upload input{display:none}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.preview img{width:100%;aspect-ratio:.74;object-fit:cover;border-radius:12px}
.empty{padding:55px 15px;text-align:center;color:#7c879b}
.small{font-size:12px;color:var(--muted)}
.folderPicker{display:grid;gap:8px}
.folderCheck{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:14px;padding:12px}
.folderCheck input{accent-color:var(--navy);width:18px;height:18px}
.tagbox{background:white;border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagbox input{border:0;outline:0;min-width:120px;flex:1;padding:6px;color:var(--navy);font:inherit;background:transparent}
.tagpill{background:#edf3fd;border-radius:999px;padding:6px 9px;font-size:12px}
.detailPhoto{width:100%;max-height:52vh;object-fit:cover;border-radius:24px;background:#eee}
.detailMeta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.detailNote{font-size:14px;line-height:1.5;color:#606b82;white-space:pre-wrap}
.rowBtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.danger{background:white;color:#a33;border:1px solid #efdada}
.ideaPhoto{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.hint{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>

<body>
<main class="app">
<section id="looks" class="page active">
<header><div class="brand">KVÉ</div><button class="circle">•••</button></header>
<input id="homeSearch" class="search" placeholder="⌕  Поиск по образам, тегам, заметкам…" oninput="renderLooks()">
<div class="chips" id="filterChips"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="emptyLooks">Нажми +, чтобы добавить первый образ</div>
</section>

<section id="folders" class="page">
<header><div class="title">Мои папки</div><button class="circle" onclick="openModal('folderModal')">＋</button></header>
<div class="folders" id="folderList"></div>
</section>

<section id="ideas" class="page">
<header><div class="title">Мои идеи</div><button class="circle" onclick="resetIdeaForm();openModal('ideaModal')">＋</button></header>
<div class="chips"><button class="chip active">Все</button><button class="chip">Без фото</button><button class="chip">С фото</button></div>
<div id="ideaList"></div>
<div class="empty" id="emptyIdeas">Здесь будут идеи, которые хочется попробовать позже</div>
</section>

<section id="searchPage" class="page">
<header><div class="title">Поиск</div></header>
<input id="globalSearch" class="input" placeholder="⌕  Например: лоферы" oninput="renderSearch()">
<div class="chips"><button class="chip active">Образы</button><button class="chip">Идеи</button><button class="chip">Вещи</button></div>
<div class="grid" id="searchGrid"></div>
</section>
</main>

<button class="fab" onclick="toggleSheet()">＋</button>

<nav class="nav">
<button onclick="go('looks')"><span class="ico">⌂</span>Образы</button>
<button onclick="go('folders')"><span class="ico">▢</span>Папки</button>
<span style="width:55px"></span>
<button onclick="go('ideas')"><span class="ico">♡</span>Идеи</button>
<button onclick="go('searchPage')"><span class="ico">⌕</span>Поиск</button>
</nav>

<div class="sheet" id="sheet" onclick="if(event.target===this)toggleSheet()">
<div class="menu">
<div class="action" onclick="startAddLook()">▧ &nbsp; Добавить образ</div>
<div class="action" onclick="startAddIdea()">✎ &nbsp; Записать идею</div>
<div class="action">♧ &nbsp; Добавить вещь <span class="small">(скоро)</span></div>
<div class="action" onclick="toggleSheet();openModal('folderModal')">□ &nbsp; Создать папку</div>
</div>
</div>

<div class="modal" id="lookModal">
<form class="panel" onsubmit="saveLook(event)">
<header><b id="lookModalTitle">Добавить образ</b><button type="button" class="circle" onclick="closeModal('lookModal')">×</button></header>
<label class="upload">＋ Загрузить фото<input id="lookFiles" type="file" accept="image/*" multiple onchange="previewFiles()"></label>
<div class="preview" id="preview"></div>
<div class="field"><label>Папки</label><div id="lookFolders" class="folderPicker"></div><div class="hint">Можно выбрать несколько папок</div></div>
<div class="field"><label>Теги</label><div class="tagbox" id="lookTagBox"><input id="lookTagInput" placeholder="Добавить тег" onkeydown="tagKey(event,'look')" onblur="commitTag('look')"></div></div>
<div class="field"><label>Заметка</label><textarea id="lookNote" placeholder="Что хочется запомнить?"></textarea></div>
<button class="primary" id="lookSaveBtn">Сохранить образ</button>
</form>
</div>

<div class="modal" id="ideaModal">
<form class="panel" onsubmit="saveIdea(event)">
<header><b id="ideaModalTitle">Новая идея</b><button type="button" class="circle" onclick="closeModal('ideaModal')">×</button></header>
<label class="upload">＋ Добавить фото <span class="small">(необязательно)</span><input id="ideaFile" type="file" accept="image/*" onchange="previewIdeaFile()"></label>
<div class="preview" id="ideaPreview"></div>
<div class="field"><label>Идея</label><textarea id="ideaText" required placeholder="Голубая рубашка + белые шорты..."></textarea></div>
<div class="field"><label>Теги</label><div class="tagbox" id="ideaTagBox"><input id="ideaTagInput" placeholder="Добавить тег" onkeydown="tagKey(event,'idea')" onblur="commitTag('idea')"></div></div>
<button class="primary" id="ideaSaveBtn">Сохранить идею</button>
</form>
</div>

<div class="modal" id="lookDetail"><div class="panel">
<header><b>Образ</b><button class="circle" onclick="closeModal('lookDetail')">×</button></header>
<div id="lookDetailBody"></div>
</div></div>

<div class="modal" id="ideaDetail"><div class="panel">
<header><b>Идея</b><button class="circle" onclick="closeModal('ideaDetail')">×</button></header>
<div id="ideaDetailBody"></div>
</div></div>

<div class="modal" id="folderModal">
<form class="panel" onsubmit="saveFolder(event)">
<header><b>Новая папка</b><button type="button" class="circle" onclick="closeModal('folderModal')">×</button></header>
<div class="field"><label>Название</label><input class="input" id="folderName" required placeholder="Например: Лето"></div>
<button class="primary">Создать папку</button>
</form>
</div>

<script>
const KEY='kve-v01';

let db;
try{
  db=JSON.parse(localStorage.getItem(KEY))||{};
}catch(e){
  db={};
}

db={
  looks:db.looks||[],
  folders:db.folders||['Лето','На каждый день'],
  ideas:db.ideas||[]
};

db.looks=db.looks.map(x=>({
  ...x,
  folders:x.folders||(x.folder?[x.folder]:[]),
  tags:x.tags||[],
  photos:x.photos||[]
}));

db.ideas=db.ideas.map(x=>({
  ...x,
  tags:x.tags||[],
  photo:x.photo||''
}));

let filesData=[];
let ideaPhotoData='';
let editingLook=null;
let editingIdea=null;
let lookTagsDraft=[];
let ideaTagsDraft=[];
let lookFoldersDraft=[];
let activeTag='Все';

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }catch(e){
    alert('На устройстве закончилось место для сохранения фото. Удали несколько старых образов или используй фото меньшего размера.');
    return false;
  }
}

function go(id){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='searchPage')renderSearch();
}

function toggleSheet(){document.getElementById('sheet').classList.toggle('show')}
function openModal(id){document.getElementById(id).classList.add('show');renderFolderOptions()}
function closeModal(id){document.getElementById(id).classList.remove('show')}

function esc(s=''){
  return String(s).replace(/[&<>'"]/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[c]));
}

function renderFolderOptions(){
  const el=document.getElementById('lookFolders');
  if(!el)return;
  el.innerHTML=db.folders.length?db.folders.map((f,i)=>
    `<label class="folderCheck">
      <input type="checkbox" ${lookFoldersDraft.includes(f)?'checked':''} onchange="toggleLookFolder(${i},this.checked)">
      <span>${esc(f)}</span>
    </label>`
  ).join(''):`<div class="small">Папок пока нет</div>`;
}

function toggleLookFolder(i,on){
  const f=db.folders[i];
  if(on&&!lookFoldersDraft.includes(f))lookFoldersDraft.push(f);
  if(!on)lookFoldersDraft=lookFoldersDraft.filter(x=>x!==f);
}

function renderFolders(){
  const el=document.getElementById('folderList');
  el.innerHTML=db.folders.map((f,i)=>{
    const n=db.looks.filter(x=>(x.folders||[]).includes(f)).length;
    return `<div class="folder">
      <div class="cover"></div>
      <h3>${esc(f)}</h3>
      <p>${n} образов</p>
    </div>`;
  }).join('');
}

function allTags(){
  return [...new Set(db.looks.flatMap(x=>x.tags))].slice(0,8);
}

function renderChips(){
  const tags=['Все',...allTags()];
  const el=document.getElementById('filterChips');
  el.innerHTML=tags.map(t=>`<button class="chip ${t===activeTag?'active':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    activeTag=b.dataset.tag;
    renderLooks();
  });
}

function lookSearchText(x){
  return [x.note,...(x.folders||[]),...x.tags].join(' ').toLowerCase();
}

function renderLooks(){
  renderChips();
  const q=(document.getElementById('homeSearch').value||'').toLowerCase();
  const arr=db.looks.filter(x=>
    (activeTag==='Все'||x.tags.includes(activeTag))&&
    (!q||lookSearchText(x).includes(q))
  );

  document.getElementById('grid').innerHTML=arr.map(x=>{
    const p=x.photos[0];
    return `<div class="look" onclick="openLook(${x.id})">
      ${p?`<img src="${p}">`:`<div class="placeholder"></div>`}
      ${x.tags[0]?`<span class="badge">${esc(x.tags[0])}</span>`:''}
    </div>`;
  }).join('');

  document.getElementById('emptyLooks').style.display=arr.length?'none':'block';
}

function renderIdeas(){
  document.getElementById('ideaList').innerHTML=db.ideas.map(x=>`
    <div class="idea" onclick="openIdea(${x.id})">
      ${x.photo?`<img class="ideaPhoto" src="${x.photo}">`:''}
      <b>${esc(x.text)}</b>
      <p>${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</p>
    </div>
  `).join('');
  document.getElementById('emptyIdeas').style.display=db.ideas.length?'none':'block';
}

function renderSearch(){
  const q=(document.getElementById('globalSearch').value||'').toLowerCase();
  const arr=q?db.looks.filter(x=>lookSearchText(x).includes(q)):db.looks;
  document.getElementById('searchGrid').innerHTML=arr.map(x=>`
    <div class="look" onclick="openLook(${x.id})">
      ${x.photos[0]?`<img src="${x.photos[0]}">`:`<div class="placeholder"></div>`}
    </div>
  `).join('');
}

function renderTagDraft(kind){
  const arr=kind==='look'?lookTagsDraft:ideaTagsDraft;
  const box=document.getElementById(kind+'TagBox');
  const input=document.getElementById(kind+'TagInput');
  box.querySelectorAll('.tagpill').forEach(x=>x.remove());

  arr.forEach((t,i)=>{
    const el=document.createElement('span');
    el.className='tagpill';
    el.innerHTML=esc(t)+' ×';
    el.onclick=()=>{
      arr.splice(i,1);
      renderTagDraft(kind);
    };
    box.insertBefore(el,input);
  });
}

function commitTag(kind){
  const input=document.getElementById(kind+'TagInput');
  const v=input.value.trim().replace(/^#/,'').replace(/,$/,'');
  if(v){
    const arr=kind==='look'?lookTagsDraft:ideaTagsDraft;
    if(!arr.includes(v))arr.push(v);
    input.value='';
    renderTagDraft(kind);
  }
}

function tagKey(e,kind){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    commitTag(kind);
  }
}

/* СЖАТИЕ ФОТО ПЕРЕД СОХРАНЕНИЕМ */
async function compressImage(file,maxSide=1400,quality=.78){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();

    r.onerror=reject;

    r.onload=()=>{
      const img=new Image();

      img.onerror=reject;

      img.onload=()=>{
        const w=img.naturalWidth;
        const h=img.naturalHeight;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        const nw=Math.round(w*scale);
        const nh=Math.round(h*scale);

        const c=document.createElement('canvas');
        c.width=nw;
        c.height=nh;

        const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0,nw,nh);

        resolve(c.toDataURL('image/jpeg',quality));
      };

      img.src=r.result;
    };

    r.readAsDataURL(file);
  });
}

async function previewFiles(){
  const input=document.getElementById('lookFiles');
  const picked=[...input.files].slice(0,Math.max(0,6-filesData.length));

  for(const file of picked){
    try{
      filesData.push(await compressImage(file));
    }catch(e){
      alert('Не удалось обработать фото');
    }
    renderLookPreview();
  }

  input.value='';
}

function renderLookPreview(){
  document.getElementById('preview').innerHTML=filesData.map(p=>`<img src="${p}">`).join('');
}

async function previewIdeaFile(){
  const input=document.getElementById('ideaFile');
  const f=input.files[0];
  if(!f)return;

  try{
    ideaPhotoData=await compressImage(f);
    document.getElementById('ideaPreview').innerHTML=`<img src="${ideaPhotoData}">`;
  }catch(e){
    alert('Не удалось обработать фото');
  }

  input.value='';
}

function resetLookForm(){
  editingLook=null;
  filesData=[];
  lookTagsDraft=[];
  lookFoldersDraft=[];
  document.getElementById('lookModalTitle').textContent='Добавить образ';
  document.getElementById('lookSaveBtn').textContent='Сохранить образ';
  document.getElementById('lookNote').value='';
  document.getElementById('preview').innerHTML='';
  document.getElementById('lookTagInput').value='';
  renderFolderOptions();
  renderTagDraft('look');
}

function startAddLook(){
  resetLookForm();
  toggleSheet();
  openModal('lookModal');
}

function saveLook(e){
  e.preventDefault();
  commitTag('look');

  if(!filesData.length){
    alert('Добавь хотя бы одно фото');
    return;
  }

  const data={
    photos:[...filesData],
    folders:[...lookFoldersDraft],
    folder:lookFoldersDraft[0]||'',
    tags:[...lookTagsDraft],
    note:document.getElementById('lookNote').value.trim()
  };

  const backup=JSON.stringify(db.looks);

  if(editingLook){
    const i=db.looks.findIndex(x=>x.id===editingLook);
    db.looks[i]={...db.looks[i],...data};
  }else{
    db.looks.unshift({id:Date.now(),...data});
  }

  if(!save()){
    db.looks=JSON.parse(backup);
    return;
  }

  closeModal('lookModal');
  resetLookForm();
  renderAll();
  go('looks');
}

function openLook(id){
  const x=db.looks.find(x=>x.id===id);
  if(!x)return;

  document.getElementById('lookDetailBody').innerHTML=`
    ${x.photos[0]?`<img class="detailPhoto" src="${x.photos[0]}">`:''}
    <div class="detailMeta">
      ${(x.folders||[]).map(f=>`<span class="tag">${esc(f)}</span>`).join('')}
      ${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
    </div>
    ${x.note?`<div class="detailNote">${esc(x.note)}</div>`:''}
    <div class="rowBtns">
      <button class="primary" onclick="editLook(${id})">Редактировать</button>
      <button class="primary danger" onclick="deleteLook(${id})">Удалить</button>
    </div>
  `;

  openModal('lookDetail');
}

function editLook(id){
  const x=db.looks.find(x=>x.id===id);
  if(!x)return;

  closeModal('lookDetail');
  editingLook=id;
  filesData=[...x.photos];
  lookTagsDraft=[...x.tags];
  lookFoldersDraft=[...(x.folders||[])];

  document.getElementById('lookModalTitle').textContent='Редактировать образ';
  document.getElementById('lookSaveBtn').textContent='Сохранить изменения';
  document.getElementById('lookNote').value=x.note||'';

  renderFolderOptions();
  renderLookPreview();
  renderTagDraft('look');
  openModal('lookModal');
}

function deleteLook(id){
  if(!confirm('Удалить этот образ?'))return;
  db.looks=db.looks.filter(x=>x.id!==id);
  save();
  closeModal('lookDetail');
  renderAll();
}

function resetIdeaForm(){
  editingIdea=null;
  ideaPhotoData='';
  ideaTagsDraft=[];
  document.getElementById('ideaModalTitle').textContent='Новая идея';
  document.getElementById('ideaSaveBtn').textContent='Сохранить идею';
  document.getElementById('ideaPreview').innerHTML='';
  document.getElementById('ideaText').value='';
  document.getElementById('ideaTagInput').value='';
  renderTagDraft('idea');
}

function startAddIdea(){
  resetIdeaForm();
  toggleSheet();
  openModal('ideaModal');
}

function saveIdea(e){
  e.preventDefault();
  commitTag('idea');

  const data={
    text:document.getElementById('ideaText').value.trim(),
    tags:[...ideaTagsDraft],
    photo:ideaPhotoData
  };

  const backup=JSON.stringify(db.ideas);

  if(editingIdea){
    const i=db.ideas.findIndex(x=>x.id===editingIdea);
    db.ideas[i]={...db.ideas[i],...data};
  }else{
    db.ideas.unshift({id:Date.now(),...data});
  }

  if(!save()){
    db.ideas=JSON.parse(backup);
    return;
  }

  closeModal('ideaModal');
  resetIdeaForm();
  renderAll();
  go('ideas');
}

function openIdea(id){
  const x=db.ideas.find(x=>x.id===id);
  if(!x)return;

  document.getElementById('ideaDetailBody').innerHTML=`
    ${x.photo?`<img class="detailPhoto" src="${x.photo}">`:''}
    <div class="detailNote" style="margin-top:12px">${esc(x.text)}</div>
    <div class="detailMeta">
      ${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
    </div>
    <button class="primary" onclick="ideaToLook(${id})">Превратить в образ</button>
    <div class="rowBtns">
      <button class="primary secondary" onclick="editIdea(${id})">Редактировать</button>
      <button class="primary danger" onclick="deleteIdea(${id})">Удалить</button>
    </div>
  `;

  openModal('ideaDetail');
}

function editIdea(id){
  const x=db.ideas.find(x=>x.id===id);
  if(!x)return;

  closeModal('ideaDetail');
  editingIdea=id;
  ideaPhotoData=x.photo||'';
  ideaTagsDraft=[...x.tags];

  document.getElementById('ideaModalTitle').textContent='Редактировать идею';
  document.getElementById('ideaSaveBtn').textContent='Сохранить изменения';
  document.getElementById('ideaText').value=x.text;
  document.getElementById('ideaPreview').innerHTML=x.photo?`<img src="${x.photo}">`:'';

  renderTagDraft('idea');
  openModal('ideaModal');
}

function deleteIdea(id){
  if(!confirm('Удалить эту идею?'))return;
  db.ideas=db.ideas.filter(x=>x.id!==id);
  save();
  closeModal('ideaDetail');
  renderAll();
}

function ideaToLook(id){
  const x=db.ideas.find(x=>x.id===id);
  if(!x)return;

  if(!x.photo){
    alert('Сначала добавь к идее фото — оно станет фотографией образа.');
    return;
  }

  db.looks.unshift({
    id:Date.now(),
    photos:[x.photo],
    folders:[],
    folder:'',
    tags:[...x.tags],
    note:x.text
  });

  db.ideas=db.ideas.filter(i=>i.id!==id);
  save();
  closeModal('ideaDetail');
  renderAll();
  go('looks');
}

function saveFolder(e){
  e.preventDefault();
  const input=document.getElementById('folderName');
  const n=input.value.trim();

  if(n&&!db.folders.includes(n))db.folders.push(n);

  save();
  e.target.reset();
  closeModal('folderModal');
  renderAll();
  go('folders');
}

function renderAll(){
  renderLooks();
  renderFolders();
  renderIdeas();
  renderSearch();
  renderFolderOptions();
}

renderAll();
</script>
</body>
</html>
